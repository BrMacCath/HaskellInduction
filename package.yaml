name:                HaskellInduction
version:             0.1.0.0
github:              "brmaccath/HaskellInduction"
license:             BSD-3-Clause
author:              "Brian Collery"
maintainer:          "example@example.com"
copyright:           "2026 Brian Collery"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/HaskellInduction#readme>

dependencies:
- base >= 4.7 && < 5
- matrix

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - ColumnSumMatrix
  - SquareMatrix
  - MatrixError

executables:
  HaskellInduction-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - HaskellInduction

tests:
  HaskellInduction-test:
    main:                Tests.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - HaskellInduction
    - hspec
