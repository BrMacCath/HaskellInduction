name: Tests

on:
    push:



jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
          stack-setup-ghc: true
          stack-version: 'latest'
          ghc-version: ''

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml', '*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build and test
        run: stack test --no-terminal --coverage

      - name: Install hpc-codecov
        run: stack install hpc-codecov --local-bin-path "$HOME/.local/bin"


      - name: Generate Codecov report
        run: |
          mkdir -p "$HOME/.local/bin"
          "$HOME/.local/bin/hpc-codecov" stack:all -X Paths_ -o codecov.json

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true